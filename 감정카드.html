<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비밀 감정 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#d5e9f8;--ink:#243e69;--soft:#5a7394;--panel:#f1f8ff;--line:#92b6e4;--back1:#7aa6dd;--back2:#a98bd8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 10%,#eef7ff 0,var(--bg) 60%);color:var(--ink);font-family:Jua,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px;min-height:100vh}
h1{margin:4px 0 6px;font-size:clamp(26px,5vw,38px);font-weight:400}
.sub{margin:0 0 22px;color:var(--soft);font-size:clamp(15px,2.6vw,19px);text-align:center}
.stage{perspective:1400px;width:min(340px,82vw);aspect-ratio:3/4}
.card{position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1);font:inherit;color:inherit}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{outline:4px solid #253d85;outline-offset:6px;border-radius:30px}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 30px #24406a33,inset 0 0 0 6px #ffffffaa}
.back{background:linear-gradient(145deg,var(--back1),var(--back2));color:#fff}
.back .q{font-size:clamp(90px,24vw,130px);line-height:1;text-shadow:0 4px 0 #0002}
.back .tap{font-size:clamp(18px,3.6vw,24px);background:#ffffff33;padding:8px 18px;border-radius:999px}
.back .pattern{position:absolute;inset:16px;border-radius:22px;border:3px dashed #ffffff66;pointer-events:none}
.front{transform:rotateY(180deg);background:var(--c,#fff)}
.front .emoji{font-size:clamp(96px,26vw,140px);line-height:1}
.front .name{font-size:clamp(38px,9vw,56px)}
.front .hint{font-size:clamp(15px,3vw,19px);color:#2d4566;background:#ffffffb3;padding:8px 14px;border-radius:14px;margin:4px 18px 0;text-align:center;display:none}
body.show-hint .front .hint{display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.controls button,.controls label{font:inherit;font-size:clamp(16px,3vw,19px);color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:10px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.controls button:hover,.controls label:hover{background:#fff}
.controls button.primary{background:#e0f5f3;border-color:#7cc9c4;color:#17707a}
.controls input{width:18px;height:18px;accent-color:#6a3fa0}
.note{margin-top:18px;color:var(--soft);font-size:15px;text-align:center;max-width:420px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<h1>비밀 감정 카드</h1>
<p class="sub">카드를 눌러 내 감정을 확인하고, 친구에게는 비밀로 해요!</p>

<div class="stage">
  <button class="card" id="card" aria-label="카드 뒤집기">
    <div class="face back" aria-hidden="true">
      <div class="pattern"></div>
      <div class="q">?</div>
      <div class="tap">눌러서 뒤집기</div>
    </div>
    <div class="face front" aria-hidden="true">
      <div class="emoji" id="emoji"></div>
      <div class="name" id="name"></div>
      <div class="hint" id="hint"></div>
    </div>
  </button>
</div>
<p class="sr" id="live" aria-live="polite"></p>

<div class="controls">
  <button class="primary" id="hide">🙈 가리기</button>
  <button id="again">🔀 다른 카드 뽑기</button>
  <label><input type="checkbox" id="hintToggle"> 음악 힌트 보기</label>
</div>
<p class="note">확인했으면 <b>가리기</b>를 눌러 감정을 숨겨 두세요.<br>다시 보고 싶으면 카드를 한 번 더 누르면 돼요.</p>

<script>
'use strict';
const emotions=[
  {name:'신나요',emoji:'😊',color:'#ffe3a3',hint:'빠르게 · 높고 통통하게'},
  {name:'편안해요',emoji:'😌',color:'#c9efd9',hint:'느리게 · 부드럽고 길게'},
  {name:'슬퍼요',emoji:'😢',color:'#cfe0fb',hint:'느리게 · 낮고 잔잔하게'},
  {name:'화나요',emoji:'😠',color:'#ffc9c2',hint:'빠르게 · 낮고 또렷하게'},
  {name:'걱정돼요',emoji:'😟',color:'#e3d6f7',hint:'보통 빠르기 · 짧고 조심스럽게'}
];
const card=document.getElementById('card'),live=document.getElementById('live');
let current=-1;
function draw(){
  let next;do{next=Math.floor(Math.random()*emotions.length);}while(next===current&&emotions.length>1);
  current=next;const e=emotions[current];
  card.style.setProperty('--c',e.color);
  document.getElementById('emoji').textContent=e.emoji;
  document.getElementById('name').textContent=e.name;
  document.getElementById('hint').textContent='🎵 '+e.hint;
}
function setFlipped(on){
  card.classList.toggle('flipped',on);
  card.setAttribute('aria-label',on?'내 감정: '+emotions[current].name+'. 눌러서 가리기':'카드 뒤집기');
  live.textContent=on?'내 감정은 '+emotions[current].name:'카드를 가렸어요';
}
card.onclick=()=>setFlipped(!card.classList.contains('flipped'));
document.getElementById('hide').onclick=()=>setFlipped(false);
document.getElementById('again').onclick=()=>{
  if(card.classList.contains('flipped')){setFlipped(false);setTimeout(()=>{draw();setFlipped(true);},450);}
  else{draw();setFlipped(true);}
};
document.getElementById('hintToggle').onchange=e=>document.body.classList.toggle('show-hint',e.target.checked);
draw();
</script>
</body>
</html>
